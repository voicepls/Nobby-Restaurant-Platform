version: "3.9"

services:
  # NestJS API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nobby:nobby_pass@db:5432/nobby_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # PostgreSQL 16
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nobby
      - POSTGRES_PASSWORD=nobby_pass
      - POSTGRES_DB=nobby_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis 7
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
